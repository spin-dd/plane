# spin-dd fork addition — upstream には存在しない新規ファイル。
#
# PoC のスタックは upstream のリリース済みイメージ makeplane/plane-*:v1.4.1 を
# 使っているため、fork 側で追加した apps/api/plane/settings/spindd.py が
# イメージに含まれていない。
#
# この override はそのファイルを読み取り専用でマウントし、
# DJANGO_SETTINGS_MODULE で有効化する。自前イメージをビルドせずに
# 設定オーバーライドを検証できる。
#
# 使い方（-f を 2 つ重ねる。順番が重要）:
#   docker compose --project-name plane-poc --env-file poc/.env \
#     --project-directory . \
#     -f deployments/cli/community/docker-compose.yml \
#     -f poc/docker-compose.override.yml up -d
#
# --project-directory . が必須。無いと相対パスが 1 つ目の compose ファイルの
# ディレクトリ（deployments/cli/community/）基準で解決され、マウント元を見失う。
#
# 本番では override ではなく自前イメージをビルドし、
# DJANGO_SETTINGS_MODULE=plane.settings.spindd を環境変数で渡すこと。

x-spindd-settings: &spindd-settings
  DJANGO_SETTINGS_MODULE: plane.settings.spindd
  # 添付は presigned POST で S3 へ直送され Django を経由しないため、
  # POST body の許容メモリは FILE_SIZE_LIMIT と切り離して 5MB に据え置く。
  DATA_UPLOAD_MAX_MEMORY_SIZE: 5242880

x-spindd-mount: &spindd-mount
  - type: bind
    source: ./apps/api/plane/settings/spindd.py
    target: /code/plane/settings/spindd.py
    read_only: true
  # 独自 Django アプリ。Dockerfile.api が `COPY plane plane/` しかしないため、
  # plane パッケージの内側に置いてある（本番イメージに含めるために必須）。
  # makemigrations がホスト側に migrations を書き出せるよう読み書き可にしている。
  - type: bind
    source: ./apps/api/plane/spindd_ext
    target: /code/plane/spindd_ext
  # fork が改変している upstream ファイル（優先度 5）。
  # これを載せないと GUEST の可視範囲が upstream のまま（作成者のみ）になり、
  # 協力会社に担当課題が見えない。CONTRIBUTING.spindd.md §3 の表と対応する。
  - type: bind
    source: ./apps/api/plane/app/views/issue/base.py
    target: /code/plane/app/views/issue/base.py
    read_only: true
  - type: bind
    source: ./apps/api/plane/app/views/issue/comment.py
    target: /code/plane/app/views/issue/comment.py
    read_only: true
  - type: bind
    source: ./apps/api/plane/app/views/issue/version.py
    target: /code/plane/app/views/issue/version.py
    read_only: true

services:
  api:
    environment: *spindd-settings
    volumes: *spindd-mount

  worker:
    environment: *spindd-settings
    volumes: *spindd-mount

  beat-worker:
    environment: *spindd-settings
    volumes: *spindd-mount
